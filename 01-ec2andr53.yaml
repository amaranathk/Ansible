- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    AMI_ID: "ami-0055977a6e828a4f4"
    SG_ID: "sg-01d559ae05d4950f8"
    ZONE_ID: "Z02447381M2WX5WD68DBZ"
    DOMAIN_NAME: "amaranath.fun"
    instances:
      - mongodb

  tasks:
  - name: Create Instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: "t3.micro"
      security_group: "{{ SG_ID }}"
      image_id: "{{ AMI_ID }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: "ec2_output"


  # - name: take the output
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output }}"

  # - name: print public ip 
  #   ansible.builtin.debug:
  #     msg: "{{ item.instances[0].public_ip_address }}"
  #   loop: "{{ ec2_output.results }}"
  
  - name: r53
    amazon.aws.route53:
      state: present
      zone: "{{ ZONE_ID }}"
      record: "{{ item.item }}.{{ DOMAIN_NAME }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"


