- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    AMI_ID: "ami-0055977a6e828a4f4"
    SG_ID: "sg-01d559ae05d4950f8"
    instances:
      - mongodb

  tasks:
  - name: Create Instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: "t3.micro"
      security_group: "{{ SG_ID }}"
      image_id: "{{ AMI_ID }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"


