- name: install mongodb-org
  ansible.builtin.package:
    name: mongodb-org
    state: present

- name: copy repo file
  ansible.builtin.replace:
    path: /etc/mongod.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: start and enable the mongodb
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: yes