- name: copy rabbitmq repo
  ansible.builtin.copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo

- name: install rabbitmq-server
  ansible.builtin.package:
    name: rabbitmq-server
    state: present

- name: create roboshop user and assign full access
  community.rabbitmq.rabbitmq_user:
    user: "{{ ROBOSHOP_USER }}"
    password: "{{ ROBOSHOP_PASSWORD }}"
    permissions:
      - vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
    state: present

- name: enable and start rabbitmq-server
  ansible.builtin.service:
    name: rabbitmq-server
    state: started
    enabled: yes