- name: install maven
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
  - maven
  - mysql

- name: maven clean package
  ansible.builtin.command: mvn clean package
  args:
    chdir: /app

- name: move {{ component }}
  ansible.builtin.command: mv target/{{ component }}-{{ version }}.jar {{ component }}.jar
  args:
    chdir: /app