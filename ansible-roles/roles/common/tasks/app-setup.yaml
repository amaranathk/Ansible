- name: create roboshop system user
  ansible.builtin.user:
    name: roboshop
    comment: System user
    shell: /sbin/nologin
    home: /app
    system: true

- name: delete exising app directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: create app directory
  ansible.builtin.file:
    name: /app
    state: directory

- name: delete existing tmp directory
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: download the {{ component }} code 
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip

- name: extract {{ component }} application
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes
